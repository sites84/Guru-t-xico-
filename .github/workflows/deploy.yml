name: Deploy Guru Toxico to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        env:
          GITHUB_PAGES: 'true'
          VITE_API_BASE_URL: 'https://guru-toxico.onrender.com'\n          VITE_SUPABASE_URL: 'https://qnxyrltqdegybgtyryaq.supabase.co'\n          VITE_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_DG1YBDeloWQYlxpXpJhqEw_2yeShcGo'
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
