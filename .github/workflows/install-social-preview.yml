name: Install social preview image

on:
  push:
    branches: ['main']
    paths:
      - 'public/og320.part*.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild the exact social preview image
        run: |
          cat public/og320.part1.b64 public/og320.part2.b64 public/og320.part3.b64 | tr -d '\n' | base64 -d > public/og-guru-toxico.jpg
          rm -f public/og320.part1.b64 public/og320.part2.b64 public/og320.part3.b64

      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og-guru-toxico.jpg public/og320.part*.b64
          git commit -m "Install correct social preview image [skip og]"
          git push
